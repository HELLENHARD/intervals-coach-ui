<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intervals.icu Coach authorization</title>

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f7f7f8;
      color: #111;
      margin: 0;
      padding: 32px;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      background: white;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 28px;
    }

    h1 {
      font-size: 24px;
      margin-top: 0;
    }

    .muted {
      color: #666;
      font-size: 14px;
    }

    .row {
      display: grid;
      gap: 10px;
      margin: 16px 0;
    }

    input,
    button {
      font: inherit;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    button {
      cursor: pointer;
      background: #111;
      color: #fff;
      border: 0;
    }

    button.secondary {
      background: #eee;
      color: #111;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .error {
      color: #a00;
      white-space: pre-wrap;
    }

    .card {
      background: #fafafa;
      border: 1px solid #e6e6e6;
      border-radius: 12px;
      padding: 14px;
      margin: 14px 0;
    }
  </style>
</head>

<body>
  <main>
    <h1>Intervals.icu Coach</h1>

    <p class="muted">
      Authorize ChatGPT to use this personal, read-only MCP server.
    </p>

    <div id="status">Loading...</div>

    <div id="login" hidden>
      <div class="row">
        <label>
          Email
          <input id="email" type="email" autocomplete="username">
        </label>
      </div>

      <div class="row">
        <label>
          Password
          <input id="password" type="password" autocomplete="current-password">
        </label>
      </div>

      <button id="signIn">Sign in</button>
    </div>

    <div id="consent" hidden>
      <div id="details" class="card"></div>

      <div class="actions">
        <button id="approve">Approve</button>
        <button id="deny" class="secondary">Deny</button>
      </div>
    </div>

    <p id="error" class="error"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://ytxmibsjaavmzbvsvmja.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_p2TeLNn_wzCHcp97NdMOhA_4VNVjsr0";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const params = new URLSearchParams(window.location.search);
    const authorizationId =
      params.get("authorization_id") || "";

    const statusEl = document.getElementById("status");
    const loginEl = document.getElementById("login");
    const consentEl = document.getElementById("consent");
    const detailsEl = document.getElementById("details");
    const errorEl = document.getElementById("error");

    function safe(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showError(error) {
      console.error(error);
      errorEl.textContent =
        error?.message || String(error);
    }

    async function load() {
      errorEl.textContent = "";

      if (!authorizationId) {
        statusEl.textContent =
          "Missing authorization_id.";
        return;
      }

      const { data: sessionData, error: sessionError } =
        await client.auth.getSession();

      if (sessionError) {
        showError(sessionError);
        return;
      }

      const user = sessionData.session?.user;

      if (!user) {
        statusEl.textContent =
          "Sign in to continue.";
        loginEl.hidden = false;
        return;
      }

      loginEl.hidden = true;

      statusEl.textContent =
        "Checking authorization request...";

      const { data, error } =
        await client.auth.oauth.getAuthorizationDetails(
          authorizationId
        );

      if (error) {
        showError(error);
        return;
      }

      if (!data) {
        showError(
          "Authorization request not found."
        );
        return;
      }

      if (!("authorization_id" in data)) {
        window.location.href = data.redirect_url;
        return;
      }

      const clientName =
        data.client?.name ||
        data.client?.client_name ||
        "ChatGPT";

      const scope =
        data.scope ||
        "openid email profile";

      detailsEl.innerHTML =
        "<strong>" +
        safe(clientName) +
        "</strong><br>" +
        '<span class="muted">Requested scopes: ' +
        safe(scope) +
        "</span>" +
        "<p>This MCP server exposes read-only Intervals.icu training and wellness tools.</p>";

      statusEl.textContent =
        "Approve access?";

      consentEl.hidden = false;
    }

    document
      .getElementById("signIn")
      .addEventListener("click", async () => {
        errorEl.textContent = "";

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        const { error } =
          await client.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          showError(error);
          return;
        }

        window.location.reload();
      });

    document
      .getElementById("approve")
      .addEventListener("click", async () => {
        const { data, error } =
          await client.auth.oauth.approveAuthorization(
            authorizationId
          );

        if (error) {
          showError(error);
          return;
        }

        window.location.href =
          data.redirect_url;
      });

    document
      .getElementById("deny")
      .addEventListener("click", async () => {
        const { data, error } =
          await client.auth.oauth.denyAuthorization(
            authorizationId
          );

        if (error) {
          showError(error);
          return;
        }

        window.location.href =
          data.redirect_url;
      });

    load().catch(showError);
  </script>
</body>
</html>
