<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Intervals.icu Coach authorization</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f7f7f8;color:#111;margin:0;padding:32px}
    main{max-width:560px;margin:0 auto;background:white;border:1px solid #ddd;border-radius:16px;padding:28px}
    h1{font-size:24px;margin-top:0}.muted{color:#666;font-size:14px}.row{display:grid;gap:10px;margin:16px 0}
    input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ccc}button{cursor:pointer;background:#111;color:#fff;border:0}
    button.secondary{background:#eee;color:#111}.actions{display:flex;gap:10px;flex-wrap:wrap}.error{color:#a00;white-space:pre-wrap}
    .card{background:#fafafa;border:1px solid #e6e6e6;border-radius:12px;padding:14px;margin:14px 0}
  </style>
</head>
<body>
<main>
  <h1>Intervals.icu Coach</h1>
  <p class="muted">Authorize ChatGPT to use this personal, read-only MCP server.</p>
  <div id="status">Loading...</div>
  <div id="login" hidden>
    <div class="row"><label>Email<input id="email" type="email" autocomplete="username"></label></div>
    <div class="row"><label>Password<input id="password" type="password" autocomplete="current-password"></label></div>
    <button id="signIn">Sign in</button>
  </div>
  <div id="consent" hidden>
    <div id="details" class="card"></div>
    <div class="actions">
      <button id="approve">Approve</button>
      <button id="deny" class="secondary">Deny</button>
    </div>
  </div>
  <p id="error" class="error"></p>
</main>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

  const SUPABASE_URL = 'https://ytxmibsjaavmzbvsvmja.supabase.co'
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_p2TeLNn_wzCHcp97NdMOhA_4VNVjsr0'

  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
  const params = new URLSearchParams(location.search)
  const authorizationId = params.get('authorization_id') || ''
  const status = document.getElementById('status')
  const login = document.getElementById('login')
  const consent = document.getElementById('consent')
  const details = document.getElementById('details')
  const errorBox = document.getElementById('error')

  function safe(value) {
    return String(value ?? '').replace(/[&<>"']/g, '')
  }

  function showError(err) {
    errorBox.textContent = err?.message || String(err)
  }

  async function load() {
    errorBox.textContent = ''
    if (!authorizationId) {
      status.textContent = 'Missing authorization_id.'
      return
    }

    const { data: sessionData } = await supabase.auth.getSession()
    const user = sessionData.session?.user
    if (!user) {
      status.textContent = 'Sign in to continue.'
      login.hidden = false
      return
    }

    login.hidden = true
    status.textContent = 'Checking authorization request...'
    const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(authorizationId)
    if (error) return showError(error)
    if (!data) return showError('Authorization request not found')

    if (!('authorization_id' in data)) {
      location.href = data.redirect_url
      return
    }

    const clientName = data.client?.name || data.client?.client_name || 'ChatGPT'
    const scope = data.scope || 'openid email profile'
    details.innerHTML = '<strong>' + safe(clientName) + '</strong><br><span class="muted">Requested scopes: ' + safe(scope) + '</span><p>This MCP server exposes read-only Intervals.icu training and wellness tools.</p>'
    status.textContent = 'Approve access?'
    consent.hidden = false
  }

  document.getElementById('signIn').addEventListener('click', async () => {
    errorBox.textContent = ''
    const email = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value
    const { error } = await supabase.auth.signInWithPassword({ email, password })
    if (error) return showError(error)
    location.reload()
  })

  document.getElementById('approve').addEventListener('click', async () => {
    const { data, error } = await supabase.auth.oauth.approveAuthorization(authorizationId)
    if (error) return showError(error)
    location.href = data.redirect_url
  })

  document.getElementById('deny').addEventListener('click', async () => {
    const { data, error } = await supabase.auth.oauth.denyAuthorization(authorizationId)
    if (error) return showError(error)
    location.href = data.redirect_url
  })

  load().catch(showError)
</script>
</body>
</html>
